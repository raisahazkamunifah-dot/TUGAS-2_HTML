<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Data Diri Siswa</title>
</head>
<body>
  <h1>Form Data Diri Siswa</h1>

<form>
  <label>Nama Lengkap</label>
  <input type="text" name="nama" placeholder="Masukkan nama" required>

  <br><br>

  <label>No Induk Asal</label>
  <input type="number" name="no_induk" placeholder="Masukkan no induk asal" required>

  <br><br>

  <label>NISN</label>
  <input type="number" name="nisn" placeholder="Masukkan NISN" required>

  <br><br>

  <label>Tanggal Lahir</label>
  <input type="date" name="tanggal_lahir" required>

  <br><br>

  <label>Jenis Kelamin</label>
  <input type="radio" name="jk" value="L"> Laki-laki
  <input type="radio" name="jk" value="P"> Perempuan

  <br><br>

  <label>Agama</label>
   <input type="text" name="agama" placeholder="Masukkan agama" required>

  <br><br>

  <label>Anak ke</label>
  <input type="number" name="anak_ke" placeholder="Masukkan anak ke" required>

  <br><br>

  <label>Status Anak Dalam Keluarga</label>
  <input type="radio" name="status_anak" value="Anak Kandung"> Anak Kandung
  <input type="radio" name="status_anak" value="Anak Angkat"> Anak Angkat
  <input type="radio" name="status_anak" value="Lainnya"> lainnya
  <br><br>

  <label>Alamat Siswa</label>
  <input type="text" name="alamat" placeholder="Masukkan alamat lengkap" required>

  <br><br>
  <label>No Telp Siswa</label>
  <input type="number" name="no_telp" placeholder="Masukkan no telp siswa" required>

  <br><br>

  <label>Sekolah Asal</label>
  <input type="text" name="sekolah_asal" placeholder="Masukkan nama sekolah asal" required>

  <h1>Data Orang Tua Kandung</h1>
<label>Nama Lengkap Ayah</label>
  <input type="text" name="nama_ayah" placeholder="Masukkan nama lengkap ayah" required>

  <br><br>
  <label>Nama Lengkap Ibu</label>
  <input type="text" name="nama_ibu" placeholder="Masukkan nama lengkap ibu" required>

  <br><br>
  <label>Alamat</label>
  <input type="text" name="alamat" placeholder="Masukkan alamat lengkap" required>

  <br><br>
<label>No.Telp</label>
  <input type="number" name="no_telp_orang_tua" placeholder="Masukkan no telp orang tua" required>

  <br><br>
  <label>Pekerjaan Ayah</label>
  <input type="text" name="pekerjaan_ayah" placeholder="Masukkan pekerjaan ayah" required>

  <br><br>
  <label>Pendidikan Terakhir Ayah</label>
  <input type="text" name="pendidikan_ayah" placeholder="Masukkan pendidikan terakhir ayah" required>

  <br><br>
  </form>
  </body>
</html>
